<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond carré arrondi, brun chaud -->
  <rect x="0" y="0" width="200" height="200" rx="42" fill="#3c332c"/>

  <!-- Anneau orange coucher de soleil -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#e07a45" stroke-width="5" opacity="0.9"/>

  <!-- Carnet, légèrement incliné -->
  <g transform="rotate(-6 100 108)">
    <!-- ombre portée -->
    <rect x="57" y="57" width="90" height="112" rx="6" fill="#241f1a" opacity="0.35"/>
    <!-- tranche du carnet -->
    <rect x="55" y="50" width="16" height="112" rx="4" fill="#c15f30"/>
    <!-- couverture, papier blanc cassé -->
    <rect x="63" y="50" width="82" height="112" rx="6" fill="#faf5ea"/>
    <!-- lignes de page, discrètes -->
    <line x1="78" y1="72" x2="128" y2="72" stroke="#ded2ba" stroke-width="3" stroke-linecap="round"/>
    <line x1="78" y1="142" x2="118" y2="142" stroke="#ded2ba" stroke-width="3" stroke-linecap="round"/>
    <!-- monogramme DD -->
    <text x="104" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#3c332c" text-anchor="middle">DD</text>
    <!-- ruban marque-page, vert naturel -->
    <polygon points="120,50 134,50 134,82 127,73 120,82" fill="#7c8f5e"/>
  </g>
</svg>
